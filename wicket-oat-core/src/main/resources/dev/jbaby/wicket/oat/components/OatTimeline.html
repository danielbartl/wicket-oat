<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<wicket:panel>
    <ol class="unstyled oat-timeline">
        <li wicket:id="events" class="oat-timeline-event">
            <div class="oat-timeline-heading">
                <strong wicket:id="title"></strong>
                <time wicket:id="time" class="text-light"></time>
            </div>
            <p wicket:id="description" class="text-light"></p>
        </li>
    </ol>
</wicket:panel>
</html>
