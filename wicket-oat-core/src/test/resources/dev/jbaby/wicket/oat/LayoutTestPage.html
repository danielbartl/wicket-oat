<!doctype html>
<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>
    <nav wicket:id="breadcrumb">
        <ol wicket:id="list">
            <li wicket:id="items">
                <a wicket:id="link"><span wicket:id="label"></span></a>
                <span wicket:id="separator" aria-hidden="true">/</span>
            </li>
        </ol>
    </nav>
</wicket:extend>
</body>
</html>
