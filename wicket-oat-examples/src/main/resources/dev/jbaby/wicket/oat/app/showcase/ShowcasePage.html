<!doctype html>
<html xmlns:wicket="http://wicket.apache.org" wicket:id="html">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Wicket Oat showcase</title>
</head>
<body>
<main class="container showcase">
    <h1>Wicket Oat showcase</h1>
    <p>Every component as the website shows it, rendered by the library.</p>
    <section wicket:id="groups" class="showcase-group">
        <h2 wicket:id="name">General</h2>
        <div class="showcase-grid">
            <article wicket:id="scenarios" class="showcase-card">
                <div wicket:id="preview" class="showcase-preview"></div>
                <footer class="showcase-footer"><strong wicket:id="title"></strong><code wicket:id="code"></code></footer>
            </article>
        </div>
    </section>
</main>
</body>
</html>
