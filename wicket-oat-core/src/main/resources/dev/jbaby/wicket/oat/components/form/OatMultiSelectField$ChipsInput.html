<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<wicket:panel>
    <div class="vstack gap-2 oat-multi-select">
        <ul wicket:id="chips" class="unstyled hstack gap-2 oat-chips">
            <li wicket:id="chip" class="oat-chip"><span wicket:id="name"></span><button wicket:id="remove" type="button" class="ghost small icon"><svg wicket:id="icon"></svg></button></li>
        </ul>
        <input wicket:id="search" type="text"/>
    </div>
</wicket:panel>
</html>
