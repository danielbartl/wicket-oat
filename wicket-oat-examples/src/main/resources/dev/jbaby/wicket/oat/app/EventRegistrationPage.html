<!doctype html>
<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>
    <section class="max-w-2xl mx-auto">
        <header class="mb-8">
            <h1 class="mb-2">Event Registration</h1>
            <p class="text-muted lead">Join us for the next Wicket Oat Meetup! Please fill out the form below to secure your spot.</p>
        </header>

        <div class="card p-8">
            <form wicket:id="registrationForm" class="vstack gap-6">
                <div wicket:id="fullName"></div>
                <div wicket:id="email"></div>
                <div wicket:id="organization"></div>
                <div wicket:id="ticketType"></div>
                <div wicket:id="dietaryRequirements"></div>
                
                <div class="mt-2">
                    <div wicket:id="subscribeNewsletter"></div>
                </div>

                <footer class="mt-4 pt-6 border-t border-faint hstack justify-end">
                    <button wicket:id="submit" type="submit">Register for Event</button>
                </footer>
            </form>
        </div>

        <div class="mt-8 text-center text-sm text-muted">
            <p>Need help? Contact us at <a href="mailto:events@oatui.dev">events@oatui.dev</a></p>
        </div>
    </section>
</wicket:extend>
</body>
</html>
