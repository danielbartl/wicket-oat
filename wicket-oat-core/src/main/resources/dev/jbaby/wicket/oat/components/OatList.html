<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<wicket:panel>
    <ul wicket:id="list" class="unstyled oat-list">
        <li wicket:id="rows" class="oat-list-row">
            <div class="oat-list-leading"><div wicket:id="leading"></div></div>
            <div class="oat-list-text">
                <a wicket:id="link" class="unstyled oat-list-link"><strong wicket:id="title"></strong></a>
                <small wicket:id="subtitle" class="text-light"></small>
            </div>
            <div class="oat-list-trailing"><div wicket:id="trailing"></div></div>
        </li>
    </ul>
    <div wicket:id="empty"></div>
</wicket:panel>
</html>
