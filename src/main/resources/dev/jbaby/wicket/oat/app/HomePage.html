<!doctype html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="utf-8"/>
    <title>Wicket Test</title>
</head>
<body>
<wicket:extend xmlns:wicket="http://wicket.apache.org">
    <h1 wicket:id="message">message-placeholder</h1>
    <p>Server time: <span wicket:id="now">now-placeholder</span></p>
    <form wicket:id="timeForm">
        <button type="button" wicket:id="refreshTime">Refresh time</button>
    </form>
</wicket:extend>
</body>
</html>
