<!doctype html>
<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>
    <!-- The app's icon sprite (Lucide shapes): the tabs use its symbols with BottomNavItem.Icon.sprite("tab-today") -->
    <svg xmlns="http://www.w3.org/2000/svg" hidden>
        <symbol id="tab-today" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/>
        </symbol>
        <symbol id="tab-capacity" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>
        </symbol>
        <symbol id="tab-team" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/>
        </symbol>
    </svg>

    <header class="hstack justify-between mb-4">
        <strong>Time off</strong>
        <wicket:link><a href="HomePage.html" class="button ghost small">All demos</a></wicket:link>
    </header>

    <wicket:child/>
</wicket:extend>
</body>
</html>
