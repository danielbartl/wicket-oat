<!doctype html>
<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>
    <h1 class="mb-2">Today</h1>
    <p class="text-light"><span wicket:id="date">Monday, 12 October</span>: <strong wicket:id="inCount">4</strong> of
        <span wicket:id="teamSize">6</span> in.</p>

    <h2 class="mt-6 mb-4">Out today</h2>
    <div wicket:id="out"></div>

    <h2 class="mt-6 mb-4">Coming up</h2>
    <div wicket:id="next"></div>
</wicket:extend>
</body>
</html>
