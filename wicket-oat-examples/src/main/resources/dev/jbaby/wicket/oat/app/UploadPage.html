<!doctype html>
<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>
    <section>
        <h1>Oat Upload Demo</h1>
        <p><code>OatFileUpload</code> is a plain HTML5 file input. <code>OatFileDropzone</code> wraps the same underlying <code>&lt;input type="file"&gt;</code> with Oat's <code>ot-upload</code> web component for a richer click-and-drag-and-drop experience &mdash; both submit and are handled server-side identically.</p>

        <form wicket:id="form" class="vstack" style="max-width: 480px;">
            <div wicket:id="plainUpload"></div>
            <div wicket:id="dropzoneUpload"></div>
        </form>
    </section>
</wicket:extend>
</body>
</html>
