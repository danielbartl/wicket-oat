<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:panel>
    <div wicket:id="container" class="avatar" style="width: 3rem; height: 3rem; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; background-color: var(--muted); overflow: hidden; font-weight: var(--font-semibold); color: var(--muted-foreground);">
        <img wicket:id="img" style="width: 100%; height: 100%; object-fit: cover;"/>
        <span wicket:id="initials"></span>
    </div>
</wicket:panel>
</body>
</html>
