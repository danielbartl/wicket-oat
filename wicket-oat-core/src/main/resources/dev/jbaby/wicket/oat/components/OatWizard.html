<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<wicket:panel>
    <div wicket:id="steps"></div>
    <form wicket:id="form" class="oat-wizard-form">
        <div wicket:id="body"></div>
        <footer class="hstack justify-between">
            <button wicket:id="back" type="button" class="outline"></button>
            <span class="oat-wizard-spacer"></span>
            <button wicket:id="next" type="submit"></button>
            <button wicket:id="finish" type="submit"></button>
        </footer>
    </form>
</wicket:panel>
</html>
