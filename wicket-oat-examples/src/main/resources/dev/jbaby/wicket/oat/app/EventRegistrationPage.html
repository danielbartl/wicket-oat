<!doctype html>
<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>
    <section>
        <header class="mb-6">
            <h1 class="mb-2">Event Registration</h1>
            <p class="text-light">Join us for the next Wicket Oat Meetup! Please fill out the form below to secure your spot.</p>
        </header>

        <div class="card p-4">
            <form wicket:id="registrationForm" class="vstack gap-4">
                <div wicket:id="fullName"></div>
                <div wicket:id="email"></div>
                <div wicket:id="organization"></div>
                <div wicket:id="ticketType"></div>
                <div wicket:id="dietaryRequirements"></div>
                
                <div class="mt-2">
                    <div wicket:id="subscribeNewsletter"></div>
                </div>

                <footer class="mt-4 hstack justify-between">
                    <span></span> <!-- Spacer -->
                    <button wicket:id="submit" type="submit">Register for Event</button>
                </footer>
            </form>
        </div>

        <div class="mt-6 text-center small text-light">
            <p>Need help? Contact us at <a href="mailto:events@oatui.dev">events@oatui.dev</a></p>
        </div>
    </section>
</wicket:extend>
</body>
</html>
